# cargo-deny: licence policy for MythBrowse (run: cargo deny check licenses).
[graph]
all-features = false

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MPL-2.0", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Zlib", "Unicode-3.0", "CDLA-Permissive-2.0", "BSL-1.0", "CC0-1.0", "MIT-0", "0BSD",
  "Unlicense", "NCSA", "BSD-1-Clause",
]
private = { ignore = true }

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
