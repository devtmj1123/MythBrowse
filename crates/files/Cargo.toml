[package]
name = "mythbrowse-files"
description = "MythBrowse files: downloads (naming, danger checks, HTTP transfer with pause/resume), native file pickers, open / show in folder, session restore model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# No SQLite and no Servo here, so the crate is tested (and type-checked for Windows with
# `--target x86_64-pc-windows-msvc`) without a C toolchain. Download history and the saved
# session live in `mythbrowse-storage`; the shell glues both to Servo (crates/shell/src/files_host.rs).
[dependencies]
serde.workspace = true
serde_json.workspace = true
log.workspace = true
url.workspace = true
# Same version/features as mythbrowse-ai (already in Cargo.lock): blocking HTTP, rustls with the
# process-wide crypto provider the shell installs, web PKI roots bundled.
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }

[target.'cfg(windows)'.dependencies]
# Already in Cargo.lock (0.59). Known folder (Downloads), the common Open dialog
# (GetOpenFileNameW), ShellExecuteW (open a file), CoTaskMemFree.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_WindowsAndMessaging",
] }
