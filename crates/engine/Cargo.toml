[package]
name = "mythbrowse-engine"
description = "Thin wrapper around the Servo web engine for MythBrowse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `servo` pulls in the full engine. Build with `--no-default-features` to test the
# pure modules (tab model, omnibox, chrome protocol) without compiling Servo.
default = ["servo"]
servo = ["dep:servo", "dep:euclid"]
# Account + E2E sync UI and `/api/sync_*` RPCs (see `chrome::Features`). Off by default: the
# Microsoft Store preview ships without cloud sync. The shell's `cloud_sync` feature turns it on.
cloud_sync = []

[dependencies]
url.workspace = true
serde.workspace = true
serde_json.workspace = true
servo = { workspace = true, optional = true }
euclid = { workspace = true, optional = true }

# On Windows Servo's surfman always takes the ANGLE (EGL over Direct3D) path, because
# servo-webxr turns on `surfman/sm-angle-default` there, and surfman then loads
# `libEGL.dll` at run time. Servo's `no-wgl` feature builds ANGLE's libEGL.dll and
# libGLESv2.dll (mozangle `egl` + `build_dlls`); CI ships them next to mythbrowse.exe.
# Without it the exe panics at startup with "egl function was not loaded".
[target.'cfg(windows)'.dependencies]
servo = { workspace = true, optional = true, features = ["no-wgl"] }
