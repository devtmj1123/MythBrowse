[package]
name = "mythbrowse-ai"
description = "MythBrowse AI layer: model clients (OpenAI-compatible, Ollama), key storage, chat, the AgentProvider boundary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Official JustMyth builds only (the shell's `official` feature turns it on). Off = the open-source
# "MythBrowse (Open Build)": its own profile folder, key-store labels and update channel.
official = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
log.workspace = true
url.workspace = true
zeroize = "1.8"
# Blocking HTTP with streaming bodies; TLS via rustls using the process-wide crypto provider
# (the shell installs aws-lc-rs, as Servo does), web PKI roots bundled.
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
# Image encoding (pure Rust; the same version Servo already pulls in, so nothing new is
# compiled for the shell).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    # OS re-authentication before revealing / exporting saved passwords (src/reauth.rs).
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
] }

[target.'cfg(not(windows))'.dependencies]
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
getrandom = { version = "0.2", features = ["std"] }
