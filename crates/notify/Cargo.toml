[package]
name = "mythbrowse-notify"
description = "MythBrowse desktop notifications: Windows toasts (WinRT), log-only elsewhere"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
log.workspace = true

# A light crate on purpose: the Windows toast code type-checks with
# `cargo clippy -p mythbrowse-notify --target x86_64-pc-windows-msvc` without Servo.
[target.'cfg(windows)'.dependencies]
# Already in Cargo.lock (0.61.3, via Servo's dependencies).
windows = { version = "0.61", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
] }
