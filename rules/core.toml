[[rule]]
id = "polyfill.notification"
title = "Notification stub (permission is always \"denied\")"
kind = "polyfill"
hosts = ["*"]
fills = ["Notification"]
note = "Scripts that read Notification.permission unguarded no longer throw; nothing is ever shown or prompted."
js = '''
// MythBrowse compat: Notification stub (rule polyfill.notification).
// Servo has no Notifications API; scripts that read Notification.permission without checking
// throw a ReferenceError ("Notification is not defined") and stop. The stub reports
// "denied" (the truth: this browser cannot show web notifications yet) and never prompts.
// SPDX-License-Identifier: MPL-2.0
// Copyright (c) 2026 JustMyth / Tan Ming Jing
if (typeof window.Notification === "undefined") {
  var Notification = function Notification(title) {
    if (!(this instanceof Notification)) throw new TypeError("Constructor Notification requires 'new'");
    throw new TypeError("Notifications are not available in this browser");
  };
  Object.defineProperty(Notification, "permission", { get: function () { return "denied"; }, configurable: true, enumerable: true });
  Notification.maxActions = 0;
  Notification.requestPermission = function (cb) {
    if (typeof cb === "function") setTimeout(function () { cb("denied"); }, 0);
    return Promise.resolve("denied");
  };
  Object.defineProperty(window, "Notification", { value: Notification, configurable: true, writable: true });
}
'''

[[rule]]
id = "site.css-animation-implicit-end"
title = "CSS animations with an implicit end keyframe end on the element's own style (Servo freezes them mid-way)"
kind = "site"
hosts = ["live.com", "microsoftonline.com", "office.com", "office365.com", "microsoft365.com", "cloud.microsoft", "microsoft.com", "azure.com", "outlook.com", "sharepoint.com", "onedrive.com", "bing.com", "msn.com", "xbox.com", "skype.com"]
note = "Servo recomputes running animations' keyframes from the already-animated style when a stylesheet changes (CSS-in-JS), so `@keyframes{0%{opacity:0}}` + fill-mode both froze Microsoft's sign-in card invisible (login.live.com). Ends such animations on the element's own value. Engine fix: upstream issue drafts/stylo-0001."
css = "[data-mb-anim-end]{animation-name:none!important}"
js = '''
// MythBrowse compat: CSS animation end state (rule site.css-animation-implicit-end).
// Two Servo bugs (stylo 0.15 servo/animation.rs + matching.rs):
//  1. When any stylesheet changes while a CSS animation runs (CSS-in-JS libraries such as
//     Griffel insert rules all the time), the keyframes are recomputed from the element's
//     *current* style, which already holds the animated value. A keyframe the @keyframes rule
//     leaves out (`@keyframes f{0%{opacity:0}}`: 100% means "the element's own value") takes
//     that mid-animation value, and with fill-mode forwards/both the element stays frozen there:
//     Microsoft's sign-in card stayed at opacity 0..0.6 (login.live.com, login.microsoftonline.com).
//  2. A finished animation is dropped, so the next stylesheet change or any change to the
//     element's animation-* properties starts it again from 0%.
//  3. A style-attribute change only swaps that one rule level, so an inline `animation-name: none`
//     leaves the last animated value in the element's style (it stayed at opacity 0 even with
//     an inline `opacity: 1`). Only a full selector re-match drops it.
// Fix: when an element's only animation ends and its end keyframe is implicit, its correct end
// state is its own style. The element gets a `data-mb-anim-end` attribute, which the rule's
// CSS (`[data-mb-anim-end]{animation-name:none!important}`, injected once at document start so
// it adds no later stylesheet change) matches: the attribute forces a full re-match (fixes 3),
// the animation is gone, and nothing can restart it (fixes 2). The attribute is removed again
// when the page changes the element's class or style attribute, so later animations the page
// starts still run. Copyright (c) 2026 JustMyth / Tan Ming Jing. SPDX-License-Identifier: MPL-2.0.
