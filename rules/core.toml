# MythBrowse core compat ruleset, compiled into the browser (crates/compat CORE_RULES).
# Format: rules/schema.json; how rules are applied: docs/COMPAT.md.
#
# Only generic, feature-guarded shims live here: each one does nothing when the engine
# already has the API, so it is safe on every site. Site-specific fixes are added only after
# they are reproduced on the real site (top-sites compat job or a user report), never guessed.
#
# JS is written in TOML literal strings ('''...''') so backslashes stay as written. Each rule's
# JS runs inside its own function (one Servo user script per rule), after the bootstrap.

schema = 1
id = "core"
version = 2026101202
description = "Built-in generic polyfills for web APIs Servo may lack."

[[rule]]
id = "polyfill.request-idle-callback"
title = "requestIdleCallback / cancelIdleCallback fallback"
kind = "polyfill"
hosts = ["*"]
fills = ["requestIdleCallback"]
note = "Runs the callback on a short timeout with a 50 ms budget, the usual fallback."
js = '''
if (typeof window.requestIdleCallback !== "function") {
  var nextId = 1, timers = {};
  window.requestIdleCallback = function (callback, options) {
    var id = nextId++;
    timers[id] = setTimeout(function () {
      delete timers[id];
      var start = Date.now();
      callback({
        didTimeout: false,
        timeRemaining: function () { return Math.max(0, 50 - (Date.now() - start)); }
      });
    }, 1);
    return id;
  };
  window.cancelIdleCallback = function (id) {
    clearTimeout(timers[id]);
    delete timers[id];
  };
}
'''

[[rule]]
id = "polyfill.intersection-observer"
title = "IntersectionObserver fallback (real viewport geometry, re-checked on scroll/resize/DOM changes)"
kind = "polyfill"
hosts = ["*"]
# ubi.com / ubisoft.com: the script thread never goes idle once IntersectionObserver exists
# (also with the MutationObserver re-checks off and checks throttled to 250 ms); without it the
# page loads. Top-1000 run 2026-10-12, root cause in the engine/site, not found yet.
exclude_hosts = ["ubi.com", "ubisoft.com"]
fills = ["IntersectionObserver"]
note = "Reports a target only when it crosses a threshold of its real intersection with the root (+rootMargin). The old stub said every target was visible at once, which made infinite-scroll pages load forever (compat-script hangs)."
js = '''
// MythBrowse compat: IntersectionObserver (rule polyfill.intersection-observer).
// Real geometry, not "everything is visible": the previous stub reported every observed element
// as intersecting at once, so infinite-scroll sentinels loaded page after page forever and the
// page never went idle (compat-script hangs in the top-sites runs). Now each target's
// intersection with the root (viewport or root element, grown by rootMargin) is computed on
// observe and re-checked after scroll / resize / DOM changes (batched to one check per frame);
// callbacks fire only when a target crosses a threshold, like the native API.
// SPDX-License-Identifier: MPL-2.0
// Copyright (c) 2026 JustMyth / Tan Ming Jing
if (typeof window.IntersectionObserver !== "function") {
  var observers = [];
  var scheduled = false;
  var raf = window.requestAnimationFrame ? function (f) { return window.requestAnimationFrame(f); } : function (f) { return setTimeout(f, 16); };
  var parseMargin = function (m) {
    var parts = String(m || "0px").trim().split(/\s+/);
    var vals = parts.map(function (p) {
      var n = parseFloat(p) || 0;
      return { v: n, pct: /%$/.test(p) };
    });
    while (vals.length < 4) vals.push(vals[vals.length === 3 ? 1 : vals.length === 2 ? 0 : 0]);
    if (parts.length === 2) vals = [vals[0], vals[1], vals[0], vals[1]];
    if (parts.length === 3) vals = [vals[0], vals[1], vals[2], vals[1]];
    return vals; // top right bottom left
  };
  var rootRect = function (obs) {
    var r;
    if (obs.root && obs.root.nodeType === 1) {
      var b = obs.root.getBoundingClientRect();
      r = { top: b.top, left: b.left, right: b.right, bottom: b.bottom };
    } else {
      var de = document.documentElement;
      var w = (de && de.clientWidth) || window.innerWidth, h = (de && de.clientHeight) || window.innerHeight;
      r = { top: 0, left: 0, right: w, bottom: h };
    }
    var m = obs._margin, W = r.right - r.left, H = r.bottom - r.top;
    var px = function (x, base) { return x.pct ? x.v * base / 100 : x.v; };
    r.top -= px(m[0], H); r.right += px(m[1], W); r.bottom += px(m[2], H); r.left -= px(m[3], W);
    r.width = Math.max(0, r.right - r.left); r.height = Math.max(0, r.bottom - r.top);
    r.x = r.left; r.y = r.top;
    return r;
  };
  var entryFor = function (obs, el, root) {
    var b = el.getBoundingClientRect();
    var connected = el.isConnected !== false && (!obs.root || obs.root.contains(el));
    var top = Math.max(b.top, root.top), left = Math.max(b.left, root.left);
    var bottom = Math.min(b.bottom, root.bottom), right = Math.min(b.right, root.right);
    var w = right - left, h = bottom - top;
    var area = b.width * b.height;
    // edge-adjacent (zero-area) intersections count, as in the spec
    var hit = connected && w >= 0 && h >= 0 && !(b.width === 0 && b.height === 0 && (b.top === 0 && b.left === 0 && b.bottom === 0));
    var ir = hit ? { top: top, left: left, bottom: bottom, right: right, width: Math.max(0, w), height: Math.max(0, h), x: left, y: top }
                 : { top: 0, left: 0, bottom: 0, right: 0, width: 0, height: 0, x: 0, y: 0 };
    var ratio = !hit ? 0 : area > 0 ? Math.min(1, (ir.width * ir.height) / area) : 1;
    return {
      target: el, time: (window.performance && performance.now) ? performance.now() : Date.now(),
      boundingClientRect: b, intersectionRect: ir, rootBounds: obs.root ? root : root,
      isIntersecting: hit, intersectionRatio: ratio, isVisible: false
    };
  };
  var thresholdIndex = function (obs, e) {
    if (!e.isIntersecting) return -1;
    var t = obs.thresholds, i = 0;
    while (i < t.length && e.intersectionRatio >= t[i]) i++;
    return i;
  };
  var check = function (obs) {
    if (!obs._targets.length) return;
    var root = rootRect(obs), out = [];
    for (var i = 0; i < obs._targets.length; i++) {
      var rec = obs._targets[i];
      var e = entryFor(obs, rec.el, root);
      var idx = thresholdIndex(obs, e);
      if (idx !== rec.last) { rec.last = idx; out.push(e); }
    }
    if (out.length) {
      obs._queue = obs._queue.concat(out);
      var q = obs._queue; obs._queue = [];
      try { obs._cb.call(obs, q, obs); } catch (err) { setTimeout(function () { throw err; }, 0); }
    }
  };
  var checkAll = function () {
    scheduled = false;
    var list = observers.slice();
    for (var i = 0; i < list.length; i++) check(list[i]);
  };
  var schedule = function () {
    if (scheduled) return;
    scheduled = true;
    raf(checkAll);
  };
  var listening = false;
  var listen = function () {
    if (listening) return;
    listening = true;
    window.addEventListener("scroll", schedule, { capture: true, passive: true });
    window.addEventListener("resize", schedule, { passive: true });
    window.addEventListener("load", schedule);
    if (typeof MutationObserver === "function") {
      var mo = new MutationObserver(schedule);
      var start = function () {
        if (document.documentElement) mo.observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ["class", "style", "hidden"] });
      };
      if (document.documentElement) start(); else document.addEventListener("DOMContentLoaded", start, { once: true });
    }
  };
  var IO = function IntersectionObserver(callback, options) {
    if (typeof callback !== "function") throw new TypeError("IntersectionObserver: callback must be a function");
    var o = options || {};
    var th = o.threshold == null ? [0] : [].concat(o.threshold);
    for (var i = 0; i < th.length; i++) {
      th[i] = Number(th[i]);
      if (!(th[i] >= 0 && th[i] <= 1)) throw new RangeError("IntersectionObserver: threshold must be in [0, 1]");
    }
    th.sort(function (a, b) { return a - b; });
    this._cb = callback;
    this._targets = [];
    this._queue = [];
    this.root = o.root || null;
    this.rootMargin = o.rootMargin || "0px";
    this._margin = parseMargin(this.rootMargin);
    this.thresholds = th;
    this.scrollMargin = "0px";
    this.delay = 0;
    this.trackVisibility = false;
  };
  IO.prototype.observe = function (el) {
    if (!el || el.nodeType !== 1) throw new TypeError("IntersectionObserver.observe: target must be an Element");
    for (var i = 0; i < this._targets.length; i++) if (this._targets[i].el === el) return;
    this._targets.push({ el: el, last: -2 });
    if (observers.indexOf(this) < 0) observers.push(this);
    listen();
    schedule();
  };
  IO.prototype.unobserve = function (el) {
    for (var i = 0; i < this._targets.length; i++) if (this._targets[i].el === el) { this._targets.splice(i, 1); break; }
    if (!this._targets.length) { var at = observers.indexOf(this); if (at >= 0) observers.splice(at, 1); }
  };
  IO.prototype.disconnect = function () {
    this._targets = [];
    var at = observers.indexOf(this);
    if (at >= 0) observers.splice(at, 1);
  };
  IO.prototype.takeRecords = function () { var q = this._queue; this._queue = []; return q; };
  window.IntersectionObserver = IO;
  if (typeof window.IntersectionObserverEntry !== "function") {
    var Entry = function IntersectionObserverEntry() {};
    Entry.prototype.isIntersecting = false;
    Entry.prototype.intersectionRatio = 0;
    window.IntersectionObserverEntry = Entry;
  }
}
'''

[[rule]]
id = "polyfill.resize-observer"
title = "ResizeObserver fallback (initial size + window resizes)"
kind = "polyfill"
hosts = ["*"]
fills = ["ResizeObserver"]
js = '''
if (typeof window.ResizeObserver !== "function") {
  var RO = function ResizeObserver(callback) {
    if (typeof callback !== "function") {
      throw new TypeError("ResizeObserver: callback must be a function");
    }
    var self = this;
    this._cb = callback;
    this._els = [];
    this._onresize = function () { self._fire(self._els.slice()); };
  };
  RO.prototype._fire = function (els) {
    if (!els.length) return;
    var entries = els.map(function (el) {
      var r = el.getBoundingClientRect();
      var rect = { x: 0, y: 0, top: 0, left: 0, width: r.width, height: r.height,
        right: r.width, bottom: r.height };
      var size = [{ inlineSize: r.width, blockSize: r.height }];
      return { target: el, contentRect: rect, borderBoxSize: size, contentBoxSize: size,
        devicePixelContentBoxSize: size };
    });
    this._cb(entries, this);
  };
  RO.prototype.observe = function (el) {
    if (this._els.indexOf(el) >= 0) return;
    if (!this._els.length) window.addEventListener("resize", this._onresize);
    this._els.push(el);
    var self = this;
    setTimeout(function () { if (self._els.indexOf(el) >= 0) self._fire([el]); }, 0);
  };
  RO.prototype.unobserve = function (el) {
    var i = this._els.indexOf(el);
    if (i >= 0) this._els.splice(i, 1);
    if (!this._els.length) window.removeEventListener("resize", this._onresize);
  };
  RO.prototype.disconnect = function () {
    this._els = [];
    window.removeEventListener("resize", this._onresize);
  };
  window.ResizeObserver = RO;
}
'''

[[rule]]
id = "polyfill.css-escape"
title = "CSS.escape (CSSOM spec algorithm)"
kind = "polyfill"
hosts = ["*"]
fills = ["CSS.escape"]
js = '''
if (window.CSS && typeof window.CSS.escape !== "function") {
  window.CSS.escape = function (value) {
    if (arguments.length === 0) throw new TypeError("CSS.escape requires an argument.");
    var string = String(value), length = string.length, index = -1, result = "";
    var first = string.charCodeAt(0), unit;
    if (length === 1 && first === 0x2D) return "\\" + string;
    while (++index < length) {
      unit = string.charCodeAt(index);
      if (unit === 0x0000) { result += "\uFFFD"; continue; }
      if ((unit >= 0x0001 && unit <= 0x001F) || unit === 0x007F ||
          (index === 0 && unit >= 0x0030 && unit <= 0x0039) ||
          (index === 1 && unit >= 0x0030 && unit <= 0x0039 && first === 0x002D)) {
        result += "\\" + unit.toString(16) + " ";
        continue;
      }
      if (unit >= 0x0080 || unit === 0x002D || unit === 0x005F ||
          (unit >= 0x0030 && unit <= 0x0039) || (unit >= 0x0041 && unit <= 0x005A) ||
          (unit >= 0x0061 && unit <= 0x007A)) {
        result += string.charAt(index);
        continue;
      }
      result += "\\" + string.charAt(index);
    }
    return result;
  };
}
'''

[[rule]]
id = "polyfill.document-fonts"
title = "document.fonts members + FontFace (fonts become @font-face rules)"
kind = "polyfill"
hosts = ["*"]
fills = ["document.fonts", "document.fonts.load", "FontFace"]
note = "Fills what the engine's FontFaceSet lacks (Servo 0.5 has only `ready`: 'document.fonts.load is not a function' in the top-1000 run) and adds FontFace; faces added to the set are written as @font-face rules so they load."
js = '''
// MythBrowse compat: document.fonts (FontFaceSet) + FontFace (rule polyfill.document-fonts).
// Servo 0.5 has a FontFaceSet with only `ready`; 0.1.x may have none. Sites call
// document.fonts.load()/check() (seen in the top-1000 run: "document.fonts.load is not a
// function") or construct FontFace objects and add them. Missing members are filled in;
// FontFace objects added to the set become @font-face rules, so the font really loads.
// SPDX-License-Identifier: MPL-2.0
// Copyright (c) 2026 JustMyth / Tan Ming Jing
(function () {
  var noop = function () {};
  var faces = [];
  var styleEl = null;
  var css = function (s) { return String(s).replace(/["\\\n]/g, " "); };
  var render = function () {
    var root = document.head || document.documentElement;
    if (!root) return;
    if (!styleEl) { styleEl = document.createElement("style"); styleEl.setAttribute("data-mb-fontfaces", ""); }
    var out = [];
    for (var i = 0; i < faces.length; i++) {
      var f = faces[i];
      if (!f._src) continue;
      out.push("@font-face{font-family:\"" + css(f.family) + "\";src:" + f._src + ";font-style:" + f.style +
               ";font-weight:" + f.weight + ";font-display:" + f.display +
               (f.unicodeRange && f.unicodeRange !== "U+0-10FFFF" ? ";unicode-range:" + f.unicodeRange : "") + "}");
    }
    styleEl.textContent = out.join("\n");
    if (!styleEl.parentNode) root.appendChild(styleEl);
  };
  var OurFontFace = null;
  if (typeof window.FontFace !== "function") {
    var FontFace = OurFontFace = function FontFace(family, source, descriptors) {
      if (!(this instanceof FontFace)) throw new TypeError("Constructor FontFace requires 'new'");
      var d = descriptors || {};
      this.family = String(family);
      this.style = d.style || "normal"; this.weight = String(d.weight || "normal");
      this.stretch = d.stretch || "normal"; this.unicodeRange = d.unicodeRange || "U+0-10FFFF";
      this.variant = d.variant || "normal"; this.featureSettings = d.featureSettings || "normal";
      this.display = d.display || "auto"; this.ascentOverride = "normal"; this.descentOverride = "normal";
      this.lineGapOverride = "normal";
      this._src = null;
      if (typeof source === "string") {
        this._src = source;
      } else if (source && (source instanceof ArrayBuffer || ArrayBuffer.isView(source))) {
        try {
          var bytes = source instanceof ArrayBuffer ? new Uint8Array(source) : new Uint8Array(source.buffer, source.byteOffset, source.byteLength);
          this._src = "url(" + URL.createObjectURL(new Blob([bytes])) + ")";
        } catch (e) { this._src = null; }
      }
      this.status = "unloaded";
      var self = this;
      this.loaded = new Promise(function (res) { self._resolve = res; });
    };
    FontFace.prototype.load = function () {
      this.status = "loaded";
      this._resolve(this);
      return this.loaded;
    };
    window.FontFace = FontFace;
  }
  var proto = {
    status: "loaded", size: 0, onloading: null, onloadingdone: null, onloadingerror: null,
    check: function () { return true; },
    // Resolves with the faces for the font's first family. check() says every font is
    // available, so load() must agree: an empty list means "no such font yet", and loaders
    // that poll load() until it is non-empty never finished (smartadserver.com: Adobe
    // Typekit's loader kept the page busy until the WebDriver timeout). When no face object
    // of ours matches, a loaded stand-in for the family is returned.
    load: function (font) {
      var m = /(?:^|\s)[\d.]+(?:px|pt|pc|em|rem|ex|ch|%|vw|vh|q|mm|cm|in)(?:\s*\/\s*\S+)?\s+(.+)$/i.exec(String(font || ""));
      var fam = (m ? m[1] : String(font || "")).split(",")[0].trim().replace(/^["']|["']$/g, "");
      var hit = faces.filter(function (f) { return String(f.family).replace(/^["']|["']$/g, "") === fam; });
      if (!hit.length && fam) {
        var stub = { family: fam, style: "normal", weight: "normal", stretch: "normal", unicodeRange: "U+0-10FFFF",
                     variant: "normal", featureSettings: "normal", display: "auto", status: "loaded" };
        stub.loaded = Promise.resolve(stub);
        stub.load = function () { return stub.loaded; };
        hit = [stub];
      }
      return Promise.resolve(hit);
    },
    add: function (face) {
      if (face && faces.indexOf(face) < 0) {
        faces.push(face);
        try { render(); } catch (e) { /* no document yet */ }
        if (face.status === "unloaded" && typeof face.load === "function") { try { face.load(); } catch (e) { /* ignore */ } }
      }
      return this;
    },
    "delete": function (face) {
      var i = faces.indexOf(face);
      if (i < 0) return false;
      faces.splice(i, 1);
      try { render(); } catch (e) { /* ignore */ }
      return true;
    },
    clear: function () { faces = []; try { render(); } catch (e) { /* ignore */ } },
    has: function (face) { return faces.indexOf(face) >= 0; },
    forEach: function (cb, thisArg) { faces.slice().forEach(function (f) { cb.call(thisArg, f, f, this); }, this); },
    values: function () { return faces.slice()[Symbol.iterator](); },
    keys: function () { return faces.slice()[Symbol.iterator](); },
    entries: function () { return faces.map(function (f) { return [f, f]; })[Symbol.iterator](); },
    addEventListener: noop, removeEventListener: noop,
    dispatchEvent: function () { return true; }
  };
  var set = document.fonts;
  if (!set) {
    set = {};
    Object.defineProperty(Document.prototype, "fonts", { get: function () { return set; }, configurable: true });
  }
  var ownSize = !("size" in set);
  for (var k in proto) {
    if (!(k in set)) {
      try { set[k] = proto[k]; } catch (e) { /* read-only native member */ }
    }
  }
  if (OurFontFace) {
    // The engine's own FontFaceSet methods only take engine FontFace objects: route ours here.
    ["add", "delete", "has"].forEach(function (name) {
      var native = set[name] !== proto[name] ? set[name] : null;
      try {
        Object.defineProperty(set, name, {
          configurable: true, writable: true,
          value: function (face) {
            if (face instanceof OurFontFace || !native) return proto[name].apply(set, arguments);
            return native.apply(set, arguments);
          }
        });
      } catch (e) { /* non-configurable */ }
    });
  }
  if (!(Symbol.iterator in set)) { try { set[Symbol.iterator] = proto.values; } catch (e) { /* ignore */ } }
  if (!set.ready || typeof set.ready.then !== "function") {
    try { Object.defineProperty(set, "ready", { value: Promise.resolve(set), configurable: true }); } catch (e) { /* ignore */ }
  }
  if (ownSize) Object.defineProperty(set, "size", { get: function () { return faces.length; }, configurable: true });
})();
'''

[[rule]]
id = "polyfill.element-animate"
title = "Element.animate stub (jumps to the end state)"
kind = "polyfill"
hosts = ["*"]
# bsky.app: the page hangs (script thread never idle) whenever Element.animate exists, with this
# stub and with one whose animations never finish; without it the page loads (still blank: the
# app does not render in Servo). Top-1000 run 2026-10-12.
exclude_hosts = ["bsky.app"]
fills = ["Element.animate", "Animation"]
note = "Web Animations missing: animations finish at once (fill: forwards keeps the last keyframe) so code waiting on them carries on. Animation/KeyframeEffect constructors: an Animation runs as a timer over its effect's duration (play/pause/cancel/finish, onfinish, finished) without animating anything; nintendo.com's app threw 'Animation is not defined' and rendered nothing."
js = '''
if (typeof Element !== "undefined" && typeof Element.prototype.animate !== "function") {
  Element.prototype.animate = function (keyframes, options) {
    var el = this, last = null, key;
    if (Array.isArray(keyframes)) {
      last = keyframes[keyframes.length - 1] || null;
    } else if (keyframes && typeof keyframes === "object") {
      last = {};
      for (key in keyframes) {
        var v = keyframes[key];
        last[key] = Array.isArray(v) ? v[v.length - 1] : v;
      }
    }
    var fill = options && typeof options === "object" ? options.fill : undefined;
    if (last && (fill === "forwards" || fill === "both")) {
      for (key in last) {
        if (key === "offset" || key === "easing" || key === "composite") continue;
        try { el.style[key] = last[key]; } catch (e) { /* unsupported property */ }
      }
    }
    var noop = function () {};
    var anim = {
      playState: "finished", currentTime: null, startTime: null, playbackRate: 1, id: "",
      effect: null, timeline: null, pending: false, replaceState: "active",
      onfinish: null, oncancel: null, onremove: null,
      play: noop, pause: noop, reverse: noop, finish: noop, cancel: noop,
      commitStyles: noop, persist: noop, updatePlaybackRate: noop,
      addEventListener: function (type, fn) {
        if (type === "finish" && typeof fn === "function") {
          setTimeout(function () { fn.call(anim, { type: "finish", target: anim }); }, 0);
        }
      },
      removeEventListener: noop,
      dispatchEvent: function () { return true; }
    };
    anim.finished = Promise.resolve(anim);
    anim.ready = Promise.resolve(anim);
    setTimeout(function () {
      if (typeof anim.onfinish === "function") anim.onfinish({ type: "finish", target: anim });
    }, 0);
    return anim;
  };
}
if (typeof window.KeyframeEffect !== "function") {
  var KE = function KeyframeEffect(target, keyframes, options) {
    var t = typeof options === "number" ? { duration: options } : (options && typeof options === "object" ? options : {});
    this.target = target || null;
    this._frames = Array.isArray(keyframes) ? keyframes.slice() : [];
    this._timing = { duration: +t.duration || 0, delay: +t.delay || 0, endDelay: +t.endDelay || 0,
      iterations: t.iterations === undefined ? 1 : +t.iterations, fill: t.fill || "auto", easing: t.easing || "linear" };
  };
  KE.prototype.getKeyframes = function () { return this._frames.slice(); };
  KE.prototype.setKeyframes = function (k) { this._frames = Array.isArray(k) ? k.slice() : []; };
  KE.prototype.getTiming = function () { var o = {}, k; for (k in this._timing) o[k] = this._timing[k]; return o; };
  KE.prototype.updateTiming = function (t) { if (t) for (var k in t) if (k in this._timing) this._timing[k] = t[k]; };
  KE.prototype.getComputedTiming = function () {
    var m = this._timing, it = isFinite(m.iterations) ? m.iterations : 0;
    return { duration: m.duration, delay: m.delay, endDelay: m.endDelay, iterations: m.iterations, fill: m.fill,
      activeDuration: m.duration * it, endTime: m.delay + m.duration * it + m.endDelay };
  };
  Object.defineProperty(window, "KeyframeEffect", { value: KE, configurable: true, writable: true });
}
if (typeof window.Animation !== "function") {
  // Runs as a timer over the effect's end time; animates nothing (Servo has no Web Animations).
  var Anim = function Animation(effect) {
