# Mirrors servo/servo's own .cargo/config.toml: Servo links with LLVM's lld-link on
# Windows (MSVC link.exe is much slower and has hit limits on Servo-sized binaries).
[target.x86_64-pc-windows-msvc]
linker = "lld-link.exe"
