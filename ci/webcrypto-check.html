<!-- WebCrypto check for the Windows smoke test (ci/smoke-windows.ps1, served by
     ci/webcrypto_check.py on http://127.0.0.1, a secure context). ML-DSA-44/65/87 must reject
     with NotSupportedError (servo-script patch 0007); the algorithms pages rely on must still
     work, with known-answer vectors where a standard one exists (RSA-OAEP decrypt and
     RSASSA-PKCS1-v1_5 sign also cover patch 0008, RSA blinding). Result: the document title
     ("webcrypto PASS n/n" or "webcrypto FAIL k/n") and a JSON report POSTed to /result. -->
<meta charset="utf-8">
<title>webcrypto running</title>
<pre id="out"></pre>
<script>
"use strict";
const S = crypto.subtle;
const enc = new TextEncoder();
const hex = (b) => Array.from(new Uint8Array(b), (x) => x.toString(16).padStart(2, "0")).join("");
const unhex = (h) => new Uint8Array(h.match(/../g).map((x) => parseInt(x, 16)));
const results = [];

async function check(name, fn) {
  try {
    const detail = await fn();
    results.push({ name, ok: true, detail: detail || "" });
  } catch (e) {
    results.push({ name, ok: false, detail: String((e && e.name) || "") + ": " + String((e && e.message) || e) });
  }
}
function expect(cond, what) { if (!cond) throw new Error(what); }
async function rejectsNotSupported(p) {
  try { await p; } catch (e) {
    expect(e && e.name === "NotSupportedError", "rejected with " + (e && e.name) + " instead of NotSupportedError");
    return "NotSupportedError";
  }
  throw new Error("resolved; ML-DSA must not be supported");
}

async function run() {
  expect(window.isSecureContext && S, "crypto.subtle unavailable (secure context: " + window.isSecureContext + ")");
  const hmacKey = await S.generateKey({ name: "HMAC", hash: "SHA-256" }, false, ["sign", "verify"]);
  for (const alg of ["ML-DSA-44", "ML-DSA-65", "ML-DSA-87"]) {
    await check(alg + " generateKey", () => rejectsNotSupported(S.generateKey({ name: alg }, true, ["sign", "verify"])));
    await check(alg + " importKey", () => rejectsNotSupported(S.importKey("spki", new Uint8Array(64), { name: alg }, true, ["verify"])));
    await check(alg + " sign", () => rejectsNotSupported(S.sign({ name: alg }, hmacKey, enc.encode("x"))));
    await check(alg + " verify", () => rejectsNotSupported(S.verify({ name: alg }, hmacKey, new Uint8Array(32), enc.encode("x"))));
  }

  await check("SHA-256 digest (FIPS 180-2 'abc')", async () => {
    const d = hex(await S.digest("SHA-256", enc.encode("abc")));
    expect(d === "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad", d);
  });
  await check("HMAC SHA-256 (RFC 4231 case 2) sign/verify", async () => {
    const k = await S.importKey("raw", enc.encode("Jefe"), { name: "HMAC", hash: "SHA-256" }, false, ["sign", "verify"]);
    const msg = enc.encode("what do ya want for nothing?");
    const sig = await S.sign("HMAC", k, msg);
    expect(hex(sig) === "5bdcc146bf60754e6a042426089575c75a003f089d2739839dec58b964ec3843", hex(sig));
    expect(await S.verify("HMAC", k, sig, msg), "verify false");
  });
  await check("AES-GCM 256 encrypt/decrypt", async () => {
    const k = await S.generateKey({ name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await S.encrypt({ name: "AES-GCM", iv }, k, enc.encode("mythbrowse"));
    const pt = new TextDecoder().decode(await S.decrypt({ name: "AES-GCM", iv }, k, ct));
    expect(pt === "mythbrowse", pt);
  });
  await check("ECDSA P-256 sign/verify", async () => {
    const kp = await S.generateKey({ name: "ECDSA", namedCurve: "P-256" }, false, ["sign", "verify"]);
    const a = { name: "ECDSA", hash: "SHA-256" };
    const sig = await S.sign(a, kp.privateKey, enc.encode("m"));
    expect(await S.verify(a, kp.publicKey, sig, enc.encode("m")), "verify false");
    expect(!(await S.verify(a, kp.publicKey, sig, enc.encode("n"))), "verified a wrong message");
  });
  await check("Ed25519 sign/verify", async () => {
    const kp = await S.generateKey({ name: "Ed25519" }, false, ["sign", "verify"]);
    const sig = await S.sign("Ed25519", kp.privateKey, enc.encode("m"));
    expect(await S.verify("Ed25519", kp.publicKey, sig, enc.encode("m")), "verify false");
  });
  await check("RSA-PSS 2048 sign/verify", async () => {
    const kp = await S.generateKey({ name: "RSA-PSS", modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: "SHA-256" }, false, ["sign", "verify"]);
    const a = { name: "RSA-PSS", saltLength: 32 };
    const sig = await S.sign(a, kp.privateKey, enc.encode("m"));
    expect(await S.verify(a, kp.publicKey, sig, enc.encode("m")), "verify false");
  });
  await check("RSASSA-PKCS1-v1_5 2048 sign/verify, deterministic", async () => {
    const kp = await S.generateKey({ name: "RSASSA-PKCS1-v1_5", modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: "SHA-256" }, false, ["sign", "verify"]);
    const s1 = await S.sign("RSASSA-PKCS1-v1_5", kp.privateKey, enc.encode("m"));
    const s2 = await S.sign("RSASSA-PKCS1-v1_5", kp.privateKey, enc.encode("m"));
    expect(hex(s1) === hex(s2), "two signatures of one message differ");
    expect(await S.verify("RSASSA-PKCS1-v1_5", kp.publicKey, s1, enc.encode("m")), "verify false");
  });
  await check("RSA-OAEP 2048 encrypt/decrypt", async () => {
    const kp = await S.generateKey({ name: "RSA-OAEP", modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: "SHA-256" }, false, ["encrypt", "decrypt"]);
    const ct = await S.encrypt({ name: "RSA-OAEP" }, kp.publicKey, enc.encode("mythbrowse"));
    const pt = new TextDecoder().decode(await S.decrypt({ name: "RSA-OAEP" }, kp.privateKey, ct));
    expect(pt === "mythbrowse", pt);
  });
  await check("PBKDF2 SHA-256 deriveBits (c=1 vector)", async () => {
    const k = await S.importKey("raw", enc.encode("password"), "PBKDF2", false, ["deriveBits"]);
    const b = hex(await S.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: enc.encode("salt"), iterations: 1 }, k, 256));
    expect(b === "120fb6cffcf8b32c43e7225256c4f837a86548c92ccc35480805987cb70be17b", b);
  });
  await check("HKDF SHA-256 deriveBits (RFC 5869 case 1)", async () => {
    const k = await S.importKey("raw", new Uint8Array(22).fill(0x0b), "HKDF", false, ["deriveBits"]);
    const b = hex(await S.deriveBits({ name: "HKDF", hash: "SHA-256", salt: unhex("000102030405060708090a0b0c"), info: unhex("f0f1f2f3f4f5f6f7f8f9") }, k, 336));
    expect(b === "3cb25f25faacd57a90434f64d0362f2a2d2d0a90cf1a5a4c5db02d56ecc4c5bf34007208d5b887185865", b);
  });
}

run().catch((e) => results.push({ name: "harness", ok: false, detail: String(e && e.message || e) })).finally(async () => {
  const passed = results.filter((r) => r.ok).length;
  const ok = results.length > 0 && passed === results.length;
  document.getElementById("out").textContent = results.map((r) => (r.ok ? "PASS " : "FAIL ") + r.name + (r.detail ? " - " + r.detail : "")).join("\n");
  try {
    await fetch("/result", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ok, passed, total: results.length, results }) });
  } catch (e) { /* the title still carries the verdict */ }
  document.title = "webcrypto " + (ok ? "PASS" : "FAIL") + " " + passed + "/" + results.length;
});
</script>
